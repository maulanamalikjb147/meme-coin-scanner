# ============================================================
# SOL/SCREENER — Kubernetes Services
# Apply: kubectl apply -f k8s/service.yaml
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: sol-screener
spec:
  type: ClusterIP
  selector: { app: mongo }
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: sol-screener
  labels: { app: backend }
spec:
  type: ClusterIP
  selector: { app: backend }
  ports:
    - name: http
      port: 8001
      targetPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: sol-screener
  labels: { app: frontend }
spec:
  type: ClusterIP
  selector: { app: frontend }
  ports:
    - name: http
      port: 80
      targetPort: 80
