version: "3.9"

# Docker Compose untuk local development / single-host production.
# Pakai: `docker compose up -d --build`
# Akses: http://localhost  (frontend & API proxy)

services:

  mongo:
    image: mongo:7
    container_name: sol_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-screener}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-screener_pass_change_me}
    volumes:
      - mongo_data:/data/db
    networks:
      - solnet
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sol_backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      # MongoDB credentials (split style — backend bangun URL otomatis)
      MONGO_USER: ${MONGO_USER:-screener}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-screener_pass_change_me}
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_AUTH_DB: admin
      DB_NAME: ${DB_NAME:-sol_screener}
      # CORS — set domain produksi-mu di sini
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
      # Anthropic
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5-20250929}
      # Telegram (boleh kosong)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # Thresholds
      ALERT_VOLUME_THRESHOLD_USD: ${ALERT_VOLUME_THRESHOLD_USD:-50000}
      HOT_VOLUME_THRESHOLD_USD: ${HOT_VOLUME_THRESHOLD_USD:-50000}
      NEW_AGE_HOURS: ${NEW_AGE_HOURS:-24}
      SCAN_INTERVAL_SECONDS: ${SCAN_INTERVAL_SECONDS:-300}
    ports:
      - "8001:8001"
    networks:
      - solnet

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NOTE: di-baked saat build. Untuk production via domain:
        # set REACT_APP_BACKEND_URL=https://meme.maulanamalik.my.id
        # atau kosongkan & andalkan nginx proxy /api → backend.
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-}
    container_name: sol_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - solnet

networks:
  solnet:
    driver: bridge

volumes:
  mongo_data:
